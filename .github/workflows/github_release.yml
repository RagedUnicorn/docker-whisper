name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
      - name: Generate changelog
        id: changelog
        run: |
          if [ -z "${{ steps.prev_tag.outputs.previous_tag }}" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            COMMITS=$(git log ${{ steps.prev_tag.outputs.previous_tag }}..${{ github.ref_name }} --pretty=format:"- %s (%h)" --reverse)
          fi
          # Compute the per-variant Docker tags from the git tag
          # (v0.5.7-1 -> version 0.5.7, build 1)
          RAW="${GITHUB_REF_NAME#v}"
          WHISPER_VERSION="${RAW%-*}"
          BUILD="${RAW##*-}"
          CPU_TAG="${WHISPER_VERSION}-cpu-${BUILD}"
          CUDA_TAG="${WHISPER_VERSION}-cuda-${BUILD}"
          REPO_LC="${GITHUB_REPOSITORY,,}"
          # Create changelog
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS" | grep -E "^- (feat|fix|docs|style|refactor|perf|test|chore)(\(.+\))?:" || echo "$COMMITS"
            echo ""
            echo "## Docker Images"
            echo ""
            echo "Pull the images:"
            echo '```bash'
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/whisper:${CPU_TAG}"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/whisper:${CUDA_TAG}"
            echo "docker pull ghcr.io/${REPO_LC}:${CPU_TAG}"
            echo "docker pull ghcr.io/${REPO_LC}:${CUDA_TAG}"
            echo '```'
            echo ""
            echo "Or use the latest tags:"
            echo '```bash'
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/whisper:latest"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/whisper:latest-cuda"
            echo '```'
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.previous_tag }}...${{ github.ref_name }}"
          } > CHANGELOG.md
          # Store for release body
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
